[package]
name = "rmk-zsa-planck-ez"
version = "0.1.0"
homepage = "https://github.com/felschr/rmk-zsa-planck-ez"
repository = "https://github.com/felschr/rmk-zsa-planck-ez"
authors = ["Felix Schröter"]
description = "RMK firmware for the ZSA Planck EZ"
readme = "README.md"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[[bin]]
name = "rmk-zsa-planck-ez"
test = false
bench = false

[[bin]]
name = "rmk-zsa-planck-ez-glow"
path = "src/glow.rs"
test = false
bench = false
required-features = ["glow"]

[dependencies]
rmk = { version = "0.9.0", default-features = false, features = ["defmt", "vial", "storage", "watchdog"] }
embassy-executor = { version = "0.10", features = [
    "defmt",
    "platform-cortex-m",
    "executor-thread",
] }
embassy-stm32 = { version = "0.6", features = [
    "stm32f303cc",
    "defmt",
    "time-driver-any",
] }
embassy-time = { version = "0.5", features = ["tick-hz-32_768", "defmt"] }

cortex-m = { version = "0.7.7", features = ['critical-section-single-core'] }
cortex-m-rt = "0.7.5"
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
static_cell = "2"

[features]
default = []
# Planck EZ Glow: I2C IS31FL3737 LED driver
glow = []
# Use the keymap ported from the user's Oryx layout instead of the ZSA/olkb
# default (src/keymap_felschr.rs instead of the stock keymap in this file).
felschr-keymap = []

[build-dependencies]
const-gen = "1.6"
json = "0.12"
xz2 = "0.1.7"

[profile.dev]
codegen-units = 1      # better optimizations
debug = true
opt-level = 1
overflow-checks = true
lto = false
panic = 'unwind'

[profile.release]
codegen-units = 1       # better optimizations
debug = true            # no overhead for bare-metal
opt-level = "z"         # optimize for binary size
overflow-checks = false
lto = "fat"
